[workspace]
resolver = "3"
members = ["bldc-driver-core", "bldc-driver-hal", "bldc-driver-rp2350"]

[workspace.dependencies]
panic-probe = { version = "0.3" }
embassy-usb-logger = "0.4.0"
embassy-usb = "0.4.0"
log = { version = "0.4" }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-storage = "0.3.1"

embassy-executor = { version = "0.7", features = [
    "task-arena-size-16384",
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.4" }
